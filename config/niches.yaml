# Prompt design notes (tuned against Adobe Stock rejections and src/qc_checker.py thresholds):
# - Mid-tone, evenly lit scenes only. No black velvet / dark rooms / UV or arc glow (contrast ratio and
#   underexposure fail). No pure-white backdrops or fog (overexposure fail) — use light grey / beige / wood.
# - Avoid subjects Adobe already rejected as "similar content": PCBs, fiber optics, CNC milling, welding arcs,
#   biomass pellets, lithium cell teardown, Thai loom / lacquerware / ceramics, eco packaging, wind turbines,
#   mainframe rooms, neon cityscapes.
# - prompt_generator rotates through base_prompts least-recently-used first, so keep each list varied.
niches:
  - name: "Technical/Industrial Trades"
    weight: 0.12
    recent_cooldown_days: 7
    base_prompts:
      - "Coordinate measuring machine probe tip touching a precision aerospace component on a light grey granite surface plate, industrial metrology, soft overhead daylight, no people"
      - "Hydraulic press die with a freshly stamped stainless steel bracket beside it on a pale workbench, industrial manufacturing detail, even factory daylight from skylights, no people"
      - "Row of calibrated gauge blocks and a micrometer on a light beige metrology bench, precision measurement concept, soft window light, no people"
      - "Industrial fuel injector nozzle and cutaway sections on a light grey studio table, precision engineering product photography, soft diffused light, chrome and brass detail, no people"
      - "Hand-forged steel chisels and a hammer on a weathered oak workbench in a bright workshop, traditional metalworking trade, overcast window light, no people"
      - "Stacked brushed aluminium extrusion profiles in a bright warehouse bay, cut ends showing cross-section pattern, industrial supply concept, no people"
      - "Gear wheels of different sizes meshing on a pale grey steel plate, mechanical engineering concept, softbox studio light, no people"
      - "Hydraulic cylinders with polished chrome piston rods lined up on a light grey workshop bench, industrial components, even overhead daylight, no people"
      - "Freshly stamped sheet metal brackets stacked in a light grey bin beside a mechanical press, manufacturing detail, bright factory daylight, no people"
    market_terms: ["hydraulic press", "hydraulic cylinder", "metal stamping die", "gauge blocks micrometer", "industrial gearbox"]
    constraints:
      no_artist_names: true
      no_real_faces: true
      no_brand_logos: true

  - name: "Scientific Research Equipment"
    weight: 0.20
    recent_cooldown_days: 5
    base_prompts:
      - "Scanning electron microscope specimen stubs in a small aluminium tray on a light grey laboratory bench, matte grey equipment, soft diffused lab lighting, no people"
      - "High-performance liquid chromatography instrument with glass solvent bottles and stainless tubing, analytical chemistry laboratory bench, bright even lab lighting, no people"
      - "Glass petri dishes and borosilicate beakers on a pale laboratory bench, soft window light, clean scientific research concept, no people"
      - "Rack of glass test tubes with pale amber liquid samples, laboratory bench, soft daylight, shallow depth of field, no people"
      - "Thermal imaging camera on a tripod pointed at an industrial motor housing, predictive maintenance concept, bright plant-room daylight, no people"
      - "Digital analytical balance with a small glass weighing boat and spatula, chemistry laboratory, soft diffused light, light grey surround, no people"
      - "Stainless steel autoclave door with pressure gauge in a bright sterilisation room, laboratory infrastructure detail, even overhead light, no people"
      - "Laboratory pipette set in a stand beside a multi-well plate, biomedical research detail, soft window light, light grey bench, no people"
    market_terms: ["scanning electron microscope", "laboratory glassware", "centrifuge laboratory", "analytical balance", "autoclave laboratory"]
    constraints:
      no_artist_names: true
      no_real_faces: true
      no_brand_logos: true

