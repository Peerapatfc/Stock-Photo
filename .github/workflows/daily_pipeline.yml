name: Daily Stock Photo Pipeline

on:
  # Cron paused until the CPU upscaler is verified (local Real-ESRGAN x4plus took ~40 min/image).
  # Re-enable: restore the two lines below.
  # schedule:
  #   - cron: '0 1 * * *'   # 08:00 ICT = 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install exiftool
        run: |
          sudo apt-get install -y libimage-exiftool-perl
          echo "exiftool version: $(exiftool -ver)"

      - name: Install Real-ESRGAN general-x4v3 (CPU torch, free alternative to Replicate)
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p "$HOME/weights"
          curl -sSL -o "$HOME/weights/realesr-general-x4v3.pth" https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          echo "REALESRGAN_WEIGHTS=$HOME/weights/realesr-general-x4v3.pth" >> "$GITHUB_ENV"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ADOBE_STOCK_SFTP_USER: ${{ secrets.ADOBE_STOCK_SFTP_USER }}
          ADOBE_STOCK_SFTP_PASS: ${{ secrets.ADOBE_STOCK_SFTP_PASS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py

      - name: Commit niche usage log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/niche_usage_log.json data/subject_usage_log.json logs/pipeline.log
          git diff --staged --quiet || git commit -m "chore: niche log $(date +%Y-%m-%d)"
          git push

      - name: Upload ready images as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-photos-${{ github.run_id }}
          path: output/*/ready/
          retention-days: 7

      - name: Upload QC-rejected images as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-${{ github.run_id }}
          path: output/*/rejected/
          retention-days: 7
          if-no-files-found: ignore
